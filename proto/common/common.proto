syntax = "proto3";

package common;
option go_package = "github.com/rd2w/rd2w-log/pkg/proto/common";

import "google/protobuf/timestamp.proto";

message Error {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

message Pagination {
  int32 page = 1;
  int32 limit = 2;
  int32 total = 3;
  bool has_next = 4;
}

message TimeRange {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message Empty {}
